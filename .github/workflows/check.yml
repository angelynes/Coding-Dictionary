# Builds the site for every pull request, without publishing it.
# The built site is attached to the run, so changes can be checked before merging.
name: Check build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
